    <script>
      try { if (sessionStorage.getItem('vy-intro-seen') === '1') document.documentElement.classList.add('quick'); } catch (e) {}

    <style>
      /* boot intro: paints before JS. Deep slate (slate + 40% navy) so cream text clears 4.5:1 */
      #boot { position: fixed; inset: 0; z-index: 150; display: grid; place-items: center; padding: 24px;
        background: #51657e; color: #e5ded2; text-align: center; --d: 1; }
      html.quick #boot { --d: 0.45; }
      .boot-hello { margin: 0; font: 300 clamp(44px, 8.4vw, 140px)/0.95 'Inter', system-ui, sans-serif; letter-spacing: -0.05em; }
      .boot-ch { display: inline-block; animation: boot-in calc(0.5s * var(--d)) cubic-bezier(.2,.75,.2,1) calc((0.25s + var(--i) * 35ms) * var(--d)) both; }
      .boot-sub { margin: 22px 0 0; font: 500 12px/1 'JetBrains Mono', ui-monospace, monospace; letter-spacing: 0.14em; text-transform: uppercase;
        animation: boot-in calc(0.6s * var(--d)) cubic-bezier(.2,.75,.2,1) calc(1.05s * var(--d)) both; }
      @keyframes boot-in { from { opacity: 0; transform: translateY(60%); } }
      @media (min-width: 768px) { .boot-hello { white-space: nowrap; } }
      @media (prefers-reduced-motion: reduce) { .boot-ch, .boot-sub { animation: none; } }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=JetBrains+Mono:wght@400;500&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
